[package]
name = "workshop-auth"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Workshop connection methods and picker policy: no default xAI login, explicit opt-in for the optional xAI card, presence-only detection of subscription CLIs, and the connection picker TUI."

[lints]
workspace = true

[features]
default = []
# The ratatui connection picker. Off for the low auth crates that only need the policy.
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
which = { workspace = true }
workshop-branding = { path = "../workshop-branding" }

ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
