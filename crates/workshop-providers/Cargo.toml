[package]
name = "workshop-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Workshop overlay: Direct API and Local provider manifests (free-first), model catalog, OpenRouter PKCE sign-in, BYOK credential broker (OS keyring + 0600 file fallback), and the [model.<key>] resolution API; maps onto xai-grok-sampler without modifying it"

[dependencies]
xai-dirs = { workspace = true }
xai-grok-extra-ca = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-grok-sampling-types = { path = "../codegen/xai-grok-sampling-types" }

base64 = { workspace = true }
fs2 = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
keyring = "4"
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[lints]
workspace = true
