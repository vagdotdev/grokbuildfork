[package]
name = "workshop-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Workshop overlay: Direct API and Local provider manifests, model catalog, and BYOK credential broker (OS keyring + atomic config); maps onto xai-grok-sampler without modifying it"

[dependencies]
xai-grok-sampler = { workspace = true }
xai-grok-sampling-types = { path = "../codegen/xai-grok-sampling-types" }

fs2 = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
keyring = "4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
