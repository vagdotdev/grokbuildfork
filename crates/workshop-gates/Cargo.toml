[package]
name = "workshop-gates"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Workshop no-xAI and no-token-theft gates. `cargo test -p workshop-gates` is the required CI check; a rename-only diff cannot pass it."

[lib]
path = "src/lib.rs"

[dependencies]
xai-grok-login = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-shell-base = { workspace = true }
xai-grok-env = { workspace = true }
xai-grok-update = { path = "../codegen/xai-grok-update" }
xai-grok-models = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-dirs = { workspace = true }
workshop-auth = { workspace = true }
workshop-adapters = { workspace = true }
workshop-providers = { workspace = true }
workshop-detect = { workspace = true }
agent-client-protocol = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
# PTY-driven smoke of the built `workshop` binary (opt-in via WORKSHOP_BIN).
xai-grok-pager-pty-harness = { path = "../codegen/xai-grok-pager-pty-harness" }
# Branding gate: slash command metadata, settings labels, theme names.
xai-grok-pager = { path = "../codegen/xai-grok-pager" }
xai-grok-pager-render = { path = "../codegen/xai-grok-pager-render" }
xai-grok-tools = { workspace = true }
# Branding gate: the assembled system prompt.
xai-grok-agent = { workspace = true }

[lints]
workspace = true
