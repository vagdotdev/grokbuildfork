[package]
name = "workshop-gates"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Workshop no-xAI and no-token-theft gates. `cargo test -p workshop-gates` is the required CI check; a rename-only diff cannot pass it."

[lib]
path = "src/lib.rs"

[dependencies]
xai-grok-login = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-shell-base = { workspace = true }
xai-grok-env = { workspace = true }
xai-grok-update = { path = "../codegen/xai-grok-update" }
xai-grok-models = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-dirs = { workspace = true }
workshop-auth = { workspace = true }
agent-client-protocol = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
# PTY-driven smoke of the built `workshop` binary (opt-in via WORKSHOP_BIN).
xai-grok-pager-pty-harness = { path = "../codegen/xai-grok-pager-pty-harness" }

[lints]
workspace = true
