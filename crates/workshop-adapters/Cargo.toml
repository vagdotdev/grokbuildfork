[package]
name = "workshop-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Workshop overlay: supervise official coding-agent CLIs (Claude Code, Codex, Cursor Agent, OpenCode) as agent adapters — spawn, normalize, cancel, resume; never hold vendor credentials"

[dependencies]
workshop-detect = { workspace = true }
xai-tty-utils = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dunce = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
