[package]
name = "workshop-adapters"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Workshop agent adapters: detect and spawn the official Claude Code, Codex, Cursor Agent, and OpenCode CLIs; never read another app's credentials"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tracing = { workspace = true }
xai-tty-utils = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
