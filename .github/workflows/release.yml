# Workshop release pipeline.
#
# Trigger: push a tag `v<semver>`.  v1.2.3 -> stable channel; v1.2.3-alpha.1 (any
# prerelease) -> alpha channel + GitHub pre-release.  `workflow_dispatch` runs the
# same build/checksum/smoke pipeline as a dry run and publishes nothing.
#
# Outputs: a GitHub Release on $WORKSHOP_RELEASE_REPO with
#   workshop-<version>-<platform>.tar.gz      (linux/macos x86_64/aarch64; windows best-effort)
#   voice-engine-<version>-<platform>.tar.gz  (whisper.cpp dictation helper, same platforms)
#   *.tar.gz.sha256                           (per-asset checksum written by the job that built it)
#   ggml-*.bin + MODEL.lock.json              (Whisper model mirror pinned by voice/MODEL.lock.json)
#   SHA256SUMS
#   GitHub artifact attestations (SLSA provenance) when the repo is public
# and an updated channel manifest on the `release-channel` branch, consumed by
# scripts/install.sh and the in-app updater.
#
# Asset hand-off: jobs never exchange Actions artifacts (the account's artifact storage
# is metered and was exhausted). `meta` creates a DRAFT release for the tag, every
# matrix job uploads straight to it (`gh release upload --clobber`), `assemble`
# downloads the assets back to compose SHA256SUMS, and `publish` flips the draft live
# after the install smoke tests pass. A draft creates no git tag, so dry runs leave
# nothing behind once `cleanup` deletes theirs. A failed tag release keeps its draft
# (with whatever was uploaded) for inspection; re-running the workflow reuses it.
#
# Signing: none beyond attestations (decision: no Apple Developer ID / notarization;
# install.sh clears the macOS quarantine attribute instead).
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   variable WORKSHOP_RELEASE_REPO   OWNER/NAME hosting releases + release-channel branch.
#                                    Defaults to this repository (vagdotdev/grokbuildfork).
#                                    Point it at the future public repo when releases move there.
#   secret   WORKSHOP_RELEASE_TOKEN  Required only when WORKSHOP_RELEASE_REPO is another
#                                    repo: a token with contents:write on that repo.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKSHOP_RELEASE_REPO: ${{ vars.WORKSHOP_RELEASE_REPO || github.repository }}
  # `gh release ...` in every job. Drafts are only visible to tokens with push access, so
  # jobs that read the draft declare `contents: write` as well.
  GH_TOKEN: ${{ secrets.WORKSHOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      publish: ${{ steps.info.outputs.publish }}
      release_repo: ${{ env.WORKSHOP_RELEASE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive version and channel
        id: info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Dry run: version from the pager-bin manifest plus a prerelease suffix, never published.
            base=$(grep -m1 '^version' crates/codegen/xai-grok-pager-bin/Cargo.toml | cut -d'"' -f2)
            tag="v${base}-dryrun.${{ github.run_number }}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          scripts/release/tag-info.sh "$tag" | tee -a "$GITHUB_OUTPUT"
          echo "release repo: $WORKSHOP_RELEASE_REPO"
      - name: Check credentials for a cross-repo release
        if: env.WORKSHOP_RELEASE_REPO != github.repository
        run: |
          if [ -z "${{ secrets.WORKSHOP_RELEASE_TOKEN }}" ]; then
            echo "::error::WORKSHOP_RELEASE_REPO=$WORKSHOP_RELEASE_REPO differs from this repo; set secret WORKSHOP_RELEASE_TOKEN (contents:write there)"
            exit 1
          fi
      - name: Create the draft release that collects the assets
        # The draft records the commit it is being built from. A re-triggered run of the same
        # tag reuses the assets already on the draft (the build jobs skip platforms that are
        # present) as long as the commit is unchanged; a moved tag purges them first.
        run: |
          tag='${{ steps.info.outputs.tag }}'
          notes='Build in progress: the release workflow is uploading assets to this draft and publishes it once the install smoke tests pass.

          Build commit: ${{ github.sha }}'
          if gh release view "$tag" --repo "$WORKSHOP_RELEASE_REPO" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$WORKSHOP_RELEASE_REPO" --json isDraft -q .isDraft)
            if [ "$draft" = true ] \
              && ! gh release view "$tag" --repo "$WORKSHOP_RELEASE_REPO" --json body -q .body | grep -q 'Build commit: ${{ github.sha }}'; then
              echo "draft $tag was built from another commit; dropping its assets"
              gh release view "$tag" --repo "$WORKSHOP_RELEASE_REPO" --json assets -q '.assets[].name' \
                | while read -r asset; do gh release delete-asset "$tag" "$asset" --repo "$WORKSHOP_RELEASE_REPO" --yes; done
              gh release edit "$tag" --repo "$WORKSHOP_RELEASE_REPO" --notes "$notes"
            else
              echo "release $tag already exists on $WORKSHOP_RELEASE_REPO; reusing it"
            fi
            exit 0
          fi
          args=(--draft --title 'Workshop ${{ steps.info.outputs.version }}' --notes "$notes")
          if [ '${{ steps.info.outputs.prerelease }}' = true ]; then
            args+=(--prerelease)
          fi
          # A tag push in this repo must point the release at that tag; a dry run has no tag
          # (GitHub creates none for a draft) and a cross-repo release gets its tag at publish.
          if [ '${{ steps.info.outputs.publish }}' = true ] && [ "$WORKSHOP_RELEASE_REPO" = '${{ github.repository }}' ]; then
            args+=(--verify-tag)
          fi
          gh release create "$tag" --repo "$WORKSHOP_RELEASE_REPO" "${args[@]}"

  lint:
    name: Lint release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s sh scripts/install.sh
          shellcheck -x scripts/release/*.sh
      - name: No xAI / Grok distribution URLs in the pipeline
        run: |
          # Bracketed characters keep this line from matching itself.
          if grep -rEn 'x\.ai|grok\.com|@xai[-]official|grok-build-public[-]artifacts' \
              .github/workflows/release.yml scripts/install.sh scripts/release/; then
            echo "::error::xAI/Grok distribution URLs are forbidden in Workshop release files"
            exit 1
          fi
      - name: Validate manifest schema is JSON
        run: jq -e '.["$schema"]' scripts/release/channel-manifest.schema.json

  build:
    name: Build ${{ matrix.platform }}
    needs: [meta, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # oldest supported image -> widest glibc compatibility
            required: true
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            required: true
          - platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            required: true
          - platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            required: true
          - platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            required: false # best-effort: never blocks a release
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: write
    env:
      # xai-grok-version stamps this into the binary (`workshop --version`, updater
      # comparisons). Both names so the tree works before and after the branding patch.
      GROK_VERSION: ${{ needs.meta.outputs.version }}
      WORKSHOP_VERSION: ${{ needs.meta.outputs.version }}
      # `release-dist` profile from Cargo.toml, stripped for distribution. Upstream tunes that
      # profile for its own build fleet (thin LTO, codegen-units=1, line-table debuginfo); on
      # hosted runners (16 GB, and 7 GB on macos-15 arm64) the single codegen unit with debuginfo
      # starves the machine mid-build (v0.1.0: "The hosted runner lost communication with the
      # server" after 1h33m, runner shutdown on arm64). Override the memory-hungry knobs: no LTO,
      # 16 codegen units, no debuginfo (it would be stripped anyway).
      # The `release-dist` *cargo feature* is deliberately not enabled: it wires
      # remote-settings behaviour Workshop does not ship.
      CARGO_PROFILE_RELEASE_DIST_STRIP: symbols
      CARGO_PROFILE_RELEASE_DIST_LTO: "off"
      CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
    steps:
      # A re-triggered run (a matrix leg lost its runner, say) only rebuilds what is missing:
      # `meta` has already purged the draft if the commit moved, so assets present here were
      # built from this very commit.
      - name: Reuse this platform's assets if a previous run of this tag already built them
        id: present
        shell: bash
        run: |
          have=$(gh release view '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --json assets -q '.assets[].name')
          skip=false
          if grep -qx 'workshop-${{ needs.meta.outputs.version }}-${{ matrix.platform }}.tar.gz' <<<"$have" \
            && grep -qx 'voice-engine-${{ needs.meta.outputs.version }}-${{ matrix.platform }}.tar.gz' <<<"$have"; then
            skip=true
            echo "::notice::${{ matrix.platform }} assets are already on the draft; skipping the build"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.present.outputs.skip != 'true'

      - name: Install protoc (same version as bin/protoc's DotSlash pin)
        if: steps.present.outputs.skip != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point the build at protoc
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install NASM (aws-lc-sys on Windows)
        if: runner.os == 'Windows' && steps.present.outputs.skip != 'true'
        uses: ilammy/setup-nasm@v1

      - name: Install Rust toolchain from rust-toolchain.toml
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      # cache-on-failure: a failure *after* the compile (packaging, upload) must not throw the
      # compiled dependencies away — the v0.1.1 macOS arm64 leg lost 27 minutes that way.
      - uses: Swatinem/rust-cache@v2
        if: steps.present.outputs.skip != 'true'
        with:
          key: release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Build workshop
        if: steps.present.outputs.skip != 'true'
        shell: bash
        env:
          # .cargo/config.toml (upstream) builds aarch64 Linux for Neoverse V2; v0.2.1's binary used
          # SVE and died with SIGILL on Raspberry Pi, Graviton2 and Linux VMs on Apple Silicon.
          # Cargo appends this to the config's flags and the last `target-cpu` wins.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=generic"
        run: cargo build --locked --profile release-dist -p xai-grok-pager-bin --target ${{ matrix.target }}

      - name: Package
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: |
          scripts/release/package.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --target-dir "target/${{ matrix.target }}/release-dist" \
            --out dist

      # The dictation helper: its own workspace (voice/engine) so whisper.cpp never enters the TUI
      # build. Metal is compiled in on Apple Silicon via the crate's target-specific dependency.
      - uses: Swatinem/rust-cache@v2
        if: steps.present.outputs.skip != 'true'
        with:
          workspaces: voice/engine
          key: voice-engine-${{ matrix.platform }}
          cache-on-failure: true
      - name: Build voice-engine
        if: steps.present.outputs.skip != 'true'
        shell: bash
        # whisper.cpp otherwise compiles for the runner's CPU (v0.2.1: AVX-512 on linux-x86_64, SVE
        # on linux-aarch64). Pin the baseline instead: x86-64-v3 on x86_64 (ggml's implicit defaults
        # would drop AVX2 too); the compiler default on aarch64 (Apple M1 / Armv8.0-A).
        env:
          TARGET: ${{ matrix.target }}
          GGML_NATIVE: "OFF"
        run: |
          if [[ "$TARGET" == x86_64-* ]]; then
            export GGML_SSE42=ON GGML_AVX=ON GGML_AVX2=ON GGML_BMI2=ON GGML_FMA=ON GGML_F16C=ON
          fi
          cargo build --release --manifest-path voice/engine/Cargo.toml --target "$TARGET"
      - name: voice-engine --version
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: voice/engine/target/${{ matrix.target }}/release/voice-engine${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - name: Package voice-engine
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: |
          scripts/release/package-engine.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --target-dir "voice/engine/target/${{ matrix.target }}/release" \
            --out dist

      # The arm64 runner has every recent Arm extension; prove the binaries also start on a plain
      # Armv8.0-A core (Raspberry Pi 4 class) before they are uploaded.
      - name: Both binaries start on a baseline Armv8.0 CPU (qemu cortex-a72)
        if: steps.present.outputs.skip != 'true' && matrix.platform == 'linux-aarch64'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          qemu-aarch64 -cpu cortex-a72 target/${{ matrix.target }}/release-dist/workshop --version
          qemu-aarch64 -cpu cortex-a72 voice/engine/target/${{ matrix.target }}/release/voice-engine --version

      - name: Per-asset checksums
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: |
          . scripts/release/lib.sh
          for f in dist/*.tar.gz; do
            printf '%s  %s\n' "$(sha256_file "$f")" "$(basename "$f")" > "$f.sha256"
          done
          cat dist/*.sha256
      - name: Upload to the draft release
        if: steps.present.outputs.skip != 'true'
        shell: bash
        run: gh release upload '${{ needs.meta.outputs.tag }}' dist/* --repo "$WORKSHOP_RELEASE_REPO" --clobber

  voice-models:
    # Mirror the Whisper models pinned in voice/MODEL.lock.json next to the CLI assets so the
    # installer and the app's self-heal never depend on Hugging Face being up.
    name: Voice model mirror
    needs: [meta, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the mirror if a previous run of this tag already uploaded it
        id: present
        run: |
          have=$(gh release view '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --json assets -q '.assets[].name')
          skip=true
          for f in MODEL.lock.json $(jq -r '.models[].file' voice/MODEL.lock.json); do
            grep -qx "$f" <<<"$have" || skip=false
          done
          [ "$skip" = true ] && echo "::notice::voice model mirror is already on the draft; skipping"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.present.outputs.skip != 'true'
        with:
          path: ~/.cache/workshop-voice-models
          key: voice-models-${{ hashFiles('voice/MODEL.lock.json') }}
      - name: Fetch and verify every pinned tier
        if: steps.present.outputs.skip != 'true'
        run: scripts/release/fetch-voice-models.sh --dist dist --cache ~/.cache/workshop-voice-models
      - name: Upload to the draft release
        if: steps.present.outputs.skip != 'true'
        run: gh release upload '${{ needs.meta.outputs.tag }}' dist/* --repo "$WORKSHOP_RELEASE_REPO" --clobber

  assemble:
    name: Assemble release (SHA256SUMS, attestations)
    needs: [meta, build, voice-models]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      attested: ${{ steps.attested.outputs.attested }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the assets the build jobs uploaded
        run: gh release download '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --dir dist
      - name: Verify the per-asset checksums and that every required platform is present
        run: |
          cd dist
          sha256sum -c -- *.sha256
          for platform in linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64; do
            for prefix in workshop voice-engine; do
              f="$prefix-${{ needs.meta.outputs.version }}-$platform.tar.gz"
              [ -f "$f" ] || { echo "::error::required asset missing from the release: $f"; exit 1; }
            done
          done
          # SHA256SUMS covers the assets themselves, not the per-asset sidecars.
          mkdir -p ../sidecars && mv -- *.sha256 ../sidecars/
      - name: SHA256SUMS
        run: |
          scripts/release/checksums.sh dist
          scripts/release/checksums.sh --check dist

      # GitHub artifact attestations (Sigstore-signed SLSA provenance) are free on public
      # repos only; private repos need Enterprise Cloud. Skipped, not faked, while private.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/workshop-*.tar.gz
            dist/voice-engine-*.tar.gz
            dist/MODEL.lock.json
            dist/SHA256SUMS
      - id: attested
        run: |
          if [ "${{ steps.attest.outcome }}" = "success" ]; then
            echo "attested=true" >> "$GITHUB_OUTPUT"
          else
            echo "attested=false" >> "$GITHUB_OUTPUT"
            echo "::notice::artifact attestations skipped (private repository)"
          fi

      - name: Upload SHA256SUMS to the draft release
        run: gh release upload '${{ needs.meta.outputs.tag }}' dist/SHA256SUMS --repo "$WORKSHOP_RELEASE_REPO" --clobber

  smoke:
    name: Install smoke (${{ matrix.runner }})
    needs: [meta, assemble]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the release assets
        run: gh release download '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --dir dist
      - name: install.sh against a local mirror of the release assets (CLI + voice helper + model)
        run: |
          scripts/release/smoke-install.sh \
            --dist dist \
            --version "${{ needs.meta.outputs.version }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --repo "$WORKSHOP_RELEASE_REPO"
      # The same string gate CI runs on the debug build, on the artifact users will install:
      # forbidden hosts may appear only in the reviewed contexts of scripts/no-xai-binary-baseline.txt.
      - name: Binary string scan of the downloaded release binary (no-xai gate)
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) platform=linux-x86_64 ;;
            Linux-aarch64) platform=linux-aarch64 ;;
            Darwin-arm64) platform=macos-aarch64 ;;
            Darwin-x86_64) platform=macos-x86_64 ;;
            *) echo "::error::no release platform for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          mkdir -p scan
          tar -xzf "dist/workshop-${{ needs.meta.outputs.version }}-$platform.tar.gz" -C scan workshop
          scripts/no-xai-scan.sh --binary scan/workshop
      - name: Voice helpers stay within each platform's CPU baseline (all four platforms)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq llvm
          scripts/release/check-cpu-baseline.sh --dist dist --version "${{ needs.meta.outputs.version }}"

  publish:
    name: Publish GitHub Release
    needs: [meta, assemble, smoke]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA256SUMS and the CLI archives
        run: |
          gh release download '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --dir dist \
            --pattern SHA256SUMS --pattern 'workshop-*.tar.gz'
      - name: Release notes
        run: |
          scripts/release/release-notes.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --tag "${{ needs.meta.outputs.tag }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --repo "${{ needs.meta.outputs.release_repo }}" \
            --dist dist \
            --attested "${{ needs.assemble.outputs.attested }}" > notes.md
          cat notes.md
      - name: Publish the draft
        run: |
          scripts/release/publish-release.sh \
            --tag "${{ needs.meta.outputs.tag }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --repo "${{ needs.meta.outputs.release_repo }}" \
            --source-repo "${{ github.repository }}" \
            --dist dist \
            --notes notes.md \
            --skip-upload

  channel:
    name: Update release-channel manifest
    needs: [meta, assemble, publish]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Serialize manifest pushes across concurrently published tags.
    concurrency:
      group: release-channel-${{ vars.WORKSHOP_RELEASE_REPO || github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA256SUMS and the CLI archives
        run: |
          gh release download '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --dir dist \
            --pattern SHA256SUMS --pattern 'workshop-*.tar.gz'
      - name: Regenerate manifests and push the release-channel branch
        run: |
          scripts/release/publish-channel.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --tag "${{ needs.meta.outputs.tag }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --repo "${{ needs.meta.outputs.release_repo }}" \
            --dist dist \
            --attested "${{ needs.assemble.outputs.attested }}"
      - name: Summary
        run: |
          {
            echo "## Workshop ${{ needs.meta.outputs.version }} (${{ needs.meta.outputs.channel }})"
            echo
            echo "- Release: https://github.com/${{ needs.meta.outputs.release_repo }}/releases/tag/${{ needs.meta.outputs.tag }}"
            echo "- Manifest: https://raw.githubusercontent.com/${{ needs.meta.outputs.release_repo }}/release-channel/${{ needs.meta.outputs.channel }}.json"
            echo "- Install: \`curl -fsSL https://raw.githubusercontent.com/${{ needs.meta.outputs.release_repo }}/release-channel/install.sh | sh\`"
            echo "- Attested: ${{ needs.assemble.outputs.attested }}"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    # Dry runs only: the draft was just the asset hand-off, and a draft owns no tag.
    name: Delete the dry-run draft
    needs: [meta, smoke]
    if: always() && needs.meta.outputs.publish == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release delete '${{ needs.meta.outputs.tag }}' --repo "$WORKSHOP_RELEASE_REPO" --yes || echo "no draft to delete"
