[package]
name = "workshop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Provider authentication companion for Grok Build"

[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "io-std"] }
toml_edit = "0.25.13"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
webbrowser = "1.2.2"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

